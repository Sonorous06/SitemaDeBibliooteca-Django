{% extends 'base.html' %}

{% block title %}Sugerir libro · Biblio Escolar{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <span class="text-[11px] font-bold uppercase tracking-[.16em] text-caramel">Herramienta docente</span>
    <h1 class="font-serif font-bold text-navy text-3xl sm:text-4xl mt-1.5 leading-tight">Sugerir adquisición de libro</h1>
    <p class="text-muted mt-2.5">Completa los datos del material académico que necesitas para tu clase.</p>

    <form method="post" class="mt-8 bg-paper border border-line rounded-2xl shadow-soft p-6 sm:p-8 space-y-5">
        {% csrf_token %}

        <!-- Título -->
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-[.12em] text-muted mb-2">
                Título del libro <span class="text-bad">*</span>
            </label>
            <input type="text" name="titulo" required placeholder="Ej. Patrones de diseño"
                   class="w-full px-3.5 py-3 bg-cream border border-line rounded-[10px] text-sm text-coffee placeholder-muted/70 outline-none focus:border-steel focus:ring-[3px] focus:ring-steel/30 transition">
        </div>

        <!-- Autores -->
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-[.12em] text-muted mb-2">
                Autor(es) <span class="text-bad">*</span>
            </label>
            <input type="text" name="autores" required placeholder="Ej. Erich Gamma"
                   class="w-full px-3.5 py-3 bg-cream border border-line rounded-[10px] text-sm text-coffee placeholder-muted/70 outline-none focus:border-steel focus:ring-[3px] focus:ring-steel/30 transition">
        </div>

        <!-- ISBN -->
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-[.12em] text-muted mb-2">
                ISBN <span class="normal-case tracking-normal font-normal text-xs">(opcional)</span>
            </label>
            <input type="text" name="isbn" placeholder="Ej. 9780201633610"
                   class="w-full px-3.5 py-3 bg-cream border border-line rounded-[10px] text-sm font-mono text-coffee placeholder-muted/70 outline-none focus:border-steel focus:ring-[3px] focus:ring-steel/30 transition">
        </div>

        <!-- Justificación -->
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-[.12em] text-muted mb-2">
                Justificación académica <span class="text-bad">*</span>
            </label>
            <textarea name="justificacion" rows="4" required
                      placeholder="¿Para qué asignatura o proyecto de clase se requiere este material?"
                      class="w-full px-3.5 py-3 bg-cream border border-line rounded-[10px] text-sm text-coffee placeholder-muted/70 outline-none focus:border-steel focus:ring-[3px] focus:ring-steel/30 transition resize-y"></textarea>
        </div>

        <!-- Botones -->
        <div class="flex items-center justify-end gap-3 pt-5 border-t border-line">
            <a href="{% url 'catalogo' %}"
               class="px-4 py-2.5 rounded-[10px] text-sm font-semibold border border-line text-coffee hover:bg-sand transition">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2.5 rounded-[10px] text-sm font-semibold bg-navy hover:bg-steel text-white shadow-[0_4px_14px_rgba(31,48,71,.30)] transition">
                Enviar sugerencia
            </button>
        </div>
    </form>
</div>
{% endblock %}
