<a href="{% url destino %}" class="group flex items-start gap-4 rounded-2xl border border-line bg-paper p-5 sm:p-6 shadow-soft transition duration-200 hover:-translate-y-0.5 hover:border-caramel hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-steel focus-visible:ring-offset-2">
    <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-caramel/15 text-caramel transition group-hover:bg-caramel/25" aria-hidden="true">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            {% if icono == 'entregar' %}
            <path d="M4 4h6a3 3 0 0 1 3 3v13a4 4 0 0 0-4-2H4z" />
            <path d="M13 7a3 3 0 0 1 3-3h4v7M16 15h6m-3-3 3 3-3 3" />
            {% elif icono == 'mostrador' %}
            <rect x="3" y="3" width="12" height="17" rx="2" />
            <path d="M7 7h4M7 11h4M18 12h5m-2.5-2.5v5M3 16h12" />
            {% elif icono == 'devolver' %}
            <path d="M8 5h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-7M10 17h6" />
            <path d="M12 8H3m4-4L3 8l4 4" />
            {% elif icono == 'multas' %}
            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h3" />
            {% endif %}
        </svg>
    </span>
    <span class="min-w-0 flex-1">
        <span class="block font-serif text-xl font-bold leading-snug text-navy">{{ titulo }}</span>
        <span class="mt-1.5 block text-sm leading-relaxed text-muted">{{ descripcion }}</span>
    </span>
    <svg class="mt-1 h-5 w-5 shrink-0 text-steel transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
</a>
