{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-8">

        <!-- Encabezado -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">Iniciar Sesión</h1>
            <p class="text-sm text-gray-400 mt-2">
                Ingresa tus credenciales para acceder a la Biblioteca Escolar.
            </p>
        </div>

        <!-- Error de credenciales -->
        {% if form.errors %}
            <div class="mb-6 p-4 rounded-xl text-sm font-medium border bg-rose-500/10 text-rose-400 border-rose-500/30">
                Usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.
            </div>
        {% endif %}

        <!-- Formulario -->
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="id_username" class="block text-xs font-semibold text-gray-400 uppercase mb-2">Usuario</label>
                <input type="text" name="username" id="id_username" required autofocus autocomplete="username"
                       class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                       placeholder="Tu nombre de usuario">
            </div>

            <div>
                <label for="id_password" class="block text-xs font-semibold text-gray-400 uppercase mb-2">Contraseña</label>
                <input type="password" name="password" id="id_password" required autocomplete="current-password"
                       class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white text-sm font-semibold rounded-xl shadow-lg transition-all">
                Entrar
            </button>

            <div class="text-right mt-2">
                <a href="{% url 'password_reset' %}" class="text-xs text-sky-400 hover:underline">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
