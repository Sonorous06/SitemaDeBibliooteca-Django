{% extends 'base.html' %}

{% block title %}Contraseña actualizada · Biblio Escolar{% endblock %}

{% block content %}
<div class="min-h-screen grid place-items-center px-4 py-12">
    <div class="w-full max-w-md">

        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-[10px] grid place-items-center bg-gradient-to-br from-caramel to-coffee text-cream">
                {% include 'partials/logo.html' %}
            </div>
            <p class="font-serif font-bold text-[19px] text-navy">Biblio Escolar</p>
        </div>

        <div class="bg-paper border border-line rounded-2xl shadow-soft p-8 text-center space-y-4">
            <div class="w-12 h-12 mx-auto rounded-full grid place-items-center bg-ok/15 text-ok">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <h1 class="font-serif font-bold text-navy text-2xl">Tu contraseña se cambió con éxito</h1>
            <p class="text-sm text-muted">En 3 segundos volverás al inicio de sesión.</p>

            <a id="volver-login" href="{% url 'login' %}"
               class="inline-block px-6 py-2.5 bg-navy hover:bg-steel text-white text-sm font-semibold rounded-[10px] shadow-[0_4px_14px_rgba(31,48,71,.30)] transition">
                Iniciar sesión
            </a>
        </div>
    </div>
</div>

<script>
    setTimeout(function () {
        const enlaceLogin = document.getElementById("volver-login");
        window.location.replace(enlaceLogin.href);
    }, 3000);
</script>
{% endblock %}
