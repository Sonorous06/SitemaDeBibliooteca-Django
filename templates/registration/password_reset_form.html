{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen bg-gray-950 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl space-y-6">
        <div>
            <h2 class="text-center text-2xl font-extrabold text-white">
                Recuperar Contraseña
            </h2>
            <p class="mt-2 text-center text-xs text-gray-400">
                Ingresa tu correo registrado y te enviaremos un enlace seguro para restablecer tu clave.
            </p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-medium text-gray-300 mb-1">
                    Corrreo Electronico :
                </label>
                <input type="email" name="email" id="id_email" required class="w-full px-4 py-2 bg-gray-950 border border-gray-800 rounded-xl text-white text-sm focus:outline-none focus:border-sky-500">
            </div>

            <button type="submit" 
                class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm rounded-xl transition-all shadow-lg">
                    Enviar Enlace de recuperacion 
            </button>
        </form>

        <div class="text-center">
            <a href="{% url 'login' %}" class="text-xs text-gray-400 hover:text-sky-400 transition-colors">
                ← Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>

{% endblock %}
